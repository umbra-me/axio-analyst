name: independent-source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.7
      - run: python -m unittest discover -s tests -t .
      - run: python -m compileall -q __init__.py application core host providers ui tools tests
      - run: python tools/runtime_manifest.py --check
